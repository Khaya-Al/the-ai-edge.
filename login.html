<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Sign in | The AI Edge</title><link rel="stylesheet" href="app.css"></head>
<body class="auth-body"><main class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>THE AI <b>EDGE</b></span></a><section class="auth-card"><div class="eyebrow">YOUR AI LEARNING SPACE</div><h1 id="authTitle">Welcome back.</h1><p id="authIntro">Sign in to continue your conversations, files and learning journey.</p>
<div class="auth-tabs"><button class="active" id="loginTab" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div>
<form id="authForm"><div id="nameField" class="field hidden"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" placeholder="Your full name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" placeholder="At least 10 characters" required></div><p class="form-error" id="authError" role="alert"></p><button class="primary-btn" id="authSubmit" type="submit">Sign in <span>→</span></button></form>
<p class="auth-legal">By continuing, you agree to use The AI Edge responsibly. Keep your password private.</p></section><a class="back-link" href="index.html">← Back to The AI Edge</a></main><script type="module" src="auth.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Studio | The AI Edge</title><link rel="stylesheet" href="platform.css"></head><body><main class="page"><a class="brand" href="app.html">◉ THE AI EDGE</a><small>PROMPT ENGINEERING STUDIO / 02</small><h1>Say it better.<br><i>Get further.</i></h1><p>Build a clear prompt and take it to the AI tool that fits your task.</p><label>OBJECTIVE<input id="goal" placeholder="What do you need the AI to do?"></label><label>CONTEXT AND AUDIENCE<textarea id="context" rows="3" placeholder="Background, audience, level…"></textarea></label><label>OUTPUT FORMAT<select id="format"><option>Structured explanation</option><option>Academic research plan</option><option>Professional report</option><option>Step-by-step practical guide</option><option>Code with explanation</option></select></label><button class="primary" id="build">Build prompt →</button><section id="output" hidden><h3>Your refined prompt</h3><pre id="prompt"></pre><button id="copy">Copy prompt</button><select id="provider"><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="perplexity">Perplexity</option></select><button id="open" class="primary">Copy & open tool ↗</button></section><a href="app.html">← Back to command centre</a></main><script src="prompt.js"></script></body></html>
